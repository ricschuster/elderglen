<!doctype html>
<html lang="en" data-base="../">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Green bean - Elderglen wiki</title>
    <link rel="stylesheet" href="../wiki.css" />
  </head>
  <body>
    <header>
      <a class="home" href="../index.html">Elderglen wiki</a
      ><a href="../fish/index.html">Fish</a
      ><a href="../bundles/index.html">Bundles</a
      ><a href="../crops/index.html">Crops</a
      ><a href="../forage/index.html">Forage</a
      ><a href="../recipes/index.html">Recipes</a
      ><a href="../places/index.html">Places</a
      ><a href="../people/index.html">People</a
      ><a href="../items/index.html">Items</a
      ><input
        id="q"
        type="search"
        placeholder="Search"
        aria-label="Search the wiki"
        autocomplete="off"
      />
      <ul id="results" hidden></ul>
    </header>
    <main>
      <h1>Green bean</h1>
      <table class="info">
        <tr>
          <th scope="row">Picture</th>
          <td>
            <img
              class="pic"
              src="../img/green-bean.png"
              alt="Green bean"
              width="64"
              height="64"
            />
          </td>
        </tr>
        <tr>
          <th scope="row">Growth</th>
          <td>
            <img
              class="strip"
              src="../img/crops/green-bean.png"
              alt="Green bean growing: seedling, sprout, leafy, ripe"
              width="256"
              height="64"
            />
          </td>
        </tr>
        <tr>
          <th scope="row">Grows in</th>
          <td>Spring</td>
        </tr>
        <tr>
          <th scope="row">Time to grow</th>
          <td>10 days</td>
        </tr>
        <tr>
          <th scope="row">Regrows every</th>
          <td>3 days</td>
        </tr>
        <tr>
          <th scope="row">Seed</th>
          <td>
            <img
              class="ico"
              src="../img/green-bean-seed.png"
              alt=""
              width="32"
              height="32"
            /><a href="../items/green-bean-seed.html">Green bean seeds</a>
          </td>
        </tr>
        <tr>
          <th scope="row">Seed price</th>
          <td>60 coins</td>
        </tr>
        <tr>
          <th scope="row">Sells for</th>
          <td>40 coins</td>
        </tr>
        <tr>
          <th scope="row">Energy</th>
          <td>25</td>
        </tr>
      </table>
    </main>
    <script src="../search-index.js"></script>
    <script src="../search.js"></script>
  </body>
</html>
