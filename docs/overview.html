<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Elderglen design overview</title>
    <style>
      :root {
        --bg: #faf7f0;
        --ink: #2b2a26;
        --muted: #6f6a5e;
        --decided: #4f8a5b;
        --proposed: #d9a441;
        --open: #c4564a;
        --line: #cfc8b6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font: 15px/1.45 system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        grid-template-columns: 1fr 360px;
        height: 100vh;
      }
      main {
        overflow: auto;
        padding: 16px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 12px;
      }
      .bar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 14px;
        cursor: pointer;
      }
      button[aria-pressed="true"] {
        background: var(--ink);
        color: #fff;
      }
      .legend {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 8px;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin: 0 4px 0 10px;
      }
      svg {
        width: 100%;
        max-width: 960px;
        height: auto;
      }
      .node {
        cursor: pointer;
      }
      .node rect.box {
        fill: #fff;
        stroke: var(--line);
        stroke-width: 1.5;
      }
      .node.sel rect.box {
        stroke: var(--ink);
        stroke-width: 3;
      }
      .node.dim {
        opacity: 0.25;
      }
      .node text {
        font-size: 13px;
        fill: var(--ink);
      }
      .node text.sm {
        font-size: 11px;
        fill: var(--muted);
      }
      .edge {
        stroke: #b9b19c;
        stroke-width: 1.5;
        fill: none;
        marker-end: url(#arr);
      }
      .edge.dim {
        opacity: 0.12;
      }
      .edge.hot {
        stroke: var(--ink);
        stroke-width: 2.5;
      }
      aside {
        border-left: 1px solid var(--line);
        background: #fff;
        overflow: auto;
        padding: 16px;
      }
      aside h2 {
        font-size: 17px;
        margin: 0 0 4px;
      }
      aside h3 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted);
        margin: 14px 0 4px;
      }
      ul {
        padding-left: 0;
        list-style: none;
        margin: 0;
      }
      li {
        margin: 0 0 8px;
        padding-left: 14px;
        position: relative;
      }
      li::before {
        content: "";
        position: absolute;
        left: 0;
        top: 7px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
      }
      li.decided {
        --c: var(--decided);
      }
      li.proposed {
        --c: var(--proposed);
      }
      li.open {
        --c: var(--open);
      }
      .ref {
        font-size: 12px;
        color: var(--muted);
        display: block;
      }
      a {
        color: #2a5d9f;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        padding: 0 8px;
        border-radius: 10px;
        background: #eee9db;
        margin-right: 4px;
      }
      @media (max-width: 800px) {
        body {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Elderglen design overview</h1>
      <p class="sub" id="sub"></p>
      <div class="bar" id="bar"></div>
      <div class="legend">
        <span class="dot" style="background: var(--decided)"></span>decided
        <span class="dot" style="background: var(--proposed)"></span>proposed
        <span class="dot" style="background: var(--open)"></span>open &nbsp; Arrows point from
        what an area needs to the area that needs it. Bottom edge of a box: built state. Star: has an open next-payoff issue.
      </div>
      <svg id="map" viewBox="0 0 960 820" role="img" aria-label="Design areas and dependencies">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0L10 5L0 10z" fill="#b9b19c" />
          </marker>
        </defs>
        <g id="edges"></g>
        <g id="nodes"></g>
      </svg>
    </main>
    <aside id="panel"></aside>
    <script>
      const DATA = {"updated":"2026-11-08","about":"Hand-kept map of the design. Edit this file, then run npm run overview. Issue titles and states come from docs/overview-issues.json, refreshed with npm run overview:refresh (needs gh). npm run overview:check fails if a note, heading, area or issue reference is wrong, or if overview.html is stale.","groups":{"core":"Core loop","world":"World and story","people":"People","systems":"Later systems","craft":"Art, sound, platform"},"areas":[{"id":"day-farming","name":"Farming and the day","group":"core","pos":[20,190],"built":"done","builtNote":"Farming, energy, clock, sleep and save work in the browser.","summary":"Plant, tend, harvest and sell inside a day with an energy budget and a clock.","items":[{"s":"decided","t":"Energy plus a running clock; passing out is a small cost, never a lose state","ref":"01_system_map.md#Day cycle"},{"s":"decided","t":"Numbers are placeholders listed in one note","ref":"07_tuning_numbers.md#Day and energy"},{"s":"open","t":"Tuning needs more playtests","ref":"07_tuning_numbers.md#Open questions for playtests"},{"s":"decided","t":"A shipping bin is added; it pays at sleep at the shop price","ref":"28_shipping_bin.md#Decisions"},{"s":"decided","t":"Bin menu is the inventory grid (tap or drag ships the whole stack, a quantity prompt ships singles) with a Shipped today tab for take-back; collection page in M3; extra bins in M5; no bin-only items","ref":"28_shipping_bin.md#Decisions"},{"s":"decided","t":"The bin stands beside the house door; sleeping shows a shipping summary screen (items, money, total) before the morning report","ref":"28_shipping_bin.md#Settled 2026-11-01 (placement, touch, summary)"},{"s":"decided","t":"Farm growth tools: three sprinkler tiers with add-ons, fruit trees, two fertilizer tiers, greenhouse and farm cave; no crows","ref":"31_farm_growth.md#Decisions"},{"s":"decided","t":"Farm tool, tree and machine numbers are Stardew's: fertilizer in the shop, sapling prices, 25,000g cave mark, machine times in Stardew minutes; sprinkler add-ons are a Ring 2 item from the warden head","ref":"07_tuning_numbers.md#Farm tools, trees and machines (2026-10-31)"},{"s":"decided","t":"Farm types: Standard and Woodland first, Meadow starts with a coop and two chickens, locked choice on the new game screen","ref":"32_farm_types.md#Decisions"}],"deps":[],"issues":[12,14,52,53,54],"issueNums":[12,14,52,53,54]},{"id":"seasons-forage","name":"Seasons, weather, foraging","group":"core","pos":[20,320],"built":"partial","builtNote":"Two seasons, forecast, spring and summer forage and crops. Autumn and winter not built (#61).","summary":"What grows and what can be found changes with the season.","items":[{"s":"decided","t":"First playable has two seasons","ref":"03_milestones.md#First playable scope"},{"s":"open","t":"Autumn and winter crops and forage","issue":61}],"deps":["day-farming"],"issues":[61],"issueNums":[61]},{"id":"skills-tools","name":"Skills, tools and quality","group":"core","pos":[20,60],"built":"done","builtNote":"Skills, professions, tool upgrades, quality tiers and eating are built (#60).","summary":"Progression inside the farm loop.","items":[{"s":"decided","t":"Tool upgrades, skill perks and quality tiers","ref":"07_tuning_numbers.md#Tool upgrades and energy"},{"s":"decided","t":"Axe, pickaxe, hoe and can share one ladder: five grades, gold plus 5 bars, a 2 day wait at the smith dwarf; copper axe clears large stumps, steel clears large logs and the Secret Woods log (Stardew's rules, answers part of #194)","ref":"44_tool_upgrades.md#Decisions","issue":194},{"s":"open","t":"Young tree and seedling swings per axe grade, large stump and log yields, smith closing on festival days","ref":"44_tool_upgrades.md#Open"},{"s":"open","t":"A minimum-quality rule on a bundle item is not designed","ref":"16_bundles.md#Systems this note depends on"}],"deps":["day-farming"],"issues":[60],"issueNums":[60,194]},{"id":"hall-bundles","name":"Village hall and bundles","group":"core","pos":[260,330],"built":"partial","builtNote":"Ten bundles work (four first-slice, six from note 35, some with stand-in pools). The 30-bundle design is not built (#179, #180).","summary":"Six rooms, 30 bundles, ending at The Last Seat, the one gate to ring 2.","items":[{"s":"decided","t":"Six rooms, 30 bundles, rooms appear by total bundles done","ref":"16_bundles.md#Decisions"},{"s":"decided","t":"The Last Seat is the single gate to ring 2","ref":"16_bundles.md#Decisions"},{"s":"decided","t":"The hall is one scrolling interior: four walled rooms and two alcoves (tank, board), a scroll each; all six drawn in slice 1","ref":"40_hall_layout.md#Decisions (2026-10-31)"},{"s":"decided","t":"The hall main room is a hub with a six-mark progress plaque over the hearth; corridors left and right, entrance bottom centre","ref":"40_hall_layout.md#Decisions (2026-10-31)"},{"s":"decided","t":"The hall shows a room reward; each system reads Hall.completedRooms","ref":"16_bundles.md#Who grants a room reward"},{"s":"proposed","t":"Every item, count and reward is a placeholder","ref":"16_bundles.md#Rooms and bundles"},{"s":"open","t":"Item pools, Last Seat numbers and pacing","issue":181},{"s":"open","t":"Does the Last Seat need a bundle from every room?","ref":"16_bundles.md#Open questions","issue":181},{"s":"open","t":"Bundle data model (the next-payoff item)","issue":179},{"s":"open","t":"Rewards pass done: bundle 15 gives Beach warp totems, bundle 20 a small glow ring, bundle 29 a large chest; found things from surface digging and the mines","ref":"63_bundle_pools_part_two.md#The rewards pass (#201)"},{"s":"decided","t":"Build in five slices, one hall room each; slice 1 is year one on the farm, all four seasons","ref":"33_build_order.md#Decisions (2026-10-31)"},{"s":"decided","t":"Year one's last day does not end the game and has no year-end screen; winter 28 rolls into spring of year 2, as in Stardew","ref":"33_build_order.md#Open"},{"s":"decided","t":"Crafting follows Stardew: a pause menu tab plus a bought workbench that uses adjacent chests; fences do not decay; lamp-posts need a battery pack, made by a lightning rod in harmless storms","ref":"34_crafting.md#Decisions"},{"s":"decided","t":"Fiber comes from weeds only and sap from chopping common trees and stumps, both as in Stardew; weed rate and tree growth days are placeholders","ref":"36_gathering_trees_sap_fiber.md#Decisions"},{"s":"decided","t":"Wood comes from about 100 farm trees on a dense day 1 farm, so wood is plentiful and energy is the limit; the carpenter also sells wood; trees are chopped with an axe (Stardew's 10 swings a tree, 5 a stump, held to repeat); goods that miss a full bag lie on the ground and walk-over pickup pulls them in","ref":"43_wood_source.md#Decisions"},{"s":"decided","t":"Tree types by region are decided for M3, not M2: three types in fixed places outside the farm, regrowing when chopped, some cosmetic and not choppable (owner, from play); names, seeds and yields are open","ref":"36_gathering_trees_sap_fiber.md#Decisions","issue":396},{"s":"decided","t":"Three woody obstacles, not one: the stump a chopped tree leaves is separate from the starting field's hardwood stumps and the bigger, tougher hollow logs, which need a better axe (owner confirmed; axe tier is partly answered by note 44, yields open)","ref":"43_wood_source.md#Decisions"},{"s":"decided","t":"Equipment as Stardew: two ring slots, boots (Defense and Immunity), hat, shirt and pants; Stardew's ring list; the slot and the glow and magnet rings are built in slice 3","ref":"37_equipment.md#Decisions"},{"s":"decided","t":"The first part of the mines (floors 1 to 10, ore shop, furnace, no creatures) is built in slice 1 so bars exist for sprinklers and machines","ref":"33_build_order.md#Slice 1: year one on the farm"},{"s":"decided","t":"Greenhouse arrives in slice 4 with the animal bundle, as in Stardew; bundle 20 moves to slice 4; bundle 12's pool avoids keg goods","ref":"35_bundle_pools.md#Decisions (2026-10-31)"},{"s":"decided","t":"Weaver's and Dyer's ask for raw goods (their rewards are the loom and dye vat); Fodder takes wheat as in Stardew; slice 4 stays as one room per slice","ref":"63_bundle_pools_part_two.md#Decided with the owner (2026-11-06)"},{"s":"open","t":"Draft item pools for slice 1 bundles and the fall and winter crop and forage names, for the owner to reshape","ref":"35_bundle_pools.md#Open"},{"s":"decided","t":"Storms follow Stardew: none in winter, summer 13 and 26 always stormy, strikes through the day caught by rods with Stardew's formula, one pack per hit rod; the rod has no reach","ref":"07_tuning_numbers.md#Seasons and weather"},{"s":"decided","t":"The lightning rod needs Cave Bat bat wing as in Stardew, so rods, packs and lamp-posts arrive in slice 3 and slice 1 storms are weather only","ref":"34_crafting.md#Items this list needs"}],"deps":["day-farming","seasons-forage","fishing","mines-combat","processing-animals","customisation"],"issues":[21,55,56,57,179,180,181],"issueNums":[21,55,56,57,179,180,181,396]},{"id":"valley-map","name":"Valley and town map","group":"world","pos":[260,60],"built":"partial","builtNote":"A placeholder farm map and map loader exist. The layout is designed but no real map is authored.","summary":"Separate areas joined by exits, buildings as interiors. Nine valley areas on eight maps (the Beach shares the River delta map), one river line, ring 2 across the bridge.","items":[{"s":"decided","t":"Map style: separate areas, exits, interiors (ADR 0005)","ref":"06_map_style.md#Decisions"},{"s":"decided","t":"Valley layout: nine areas on eight maps (Beach shares the River delta map, SC-34), river from Mountain to delta, farm with three exits","ref":"19_valley_layout.md#The areas","issue":67},{"s":"decided","t":"The Outpost (2026-11-06): the carrier post moves out of the general store; the hall steward is postmaster and lives at the Outpost (nobody lives at the hall); the courier hangs out there without working; it handles mail and parcels, a notice board, road news and travelling traders","ref":"20_ring1_cast.md"},{"s":"decided","t":"Hearthwell holds all Brimmers; hall at its east end; sawmill; log gates the Secret Woods","ref":"19_valley_layout.md#Decisions"},{"s":"decided","t":"Farm types: hand-authored maps, less farmland for a perk, two in the first version (Standard, Woodland), about six later; only the three exits are fixed","ref":"25_stardew_system_review.md#Owner decisions, 2026-10-30"},{"s":"decided","t":"Farm layout (draft): dense day 1 clutter with no cleared plot, about 80 by 65 tiles, house north-east, bin and mailbox by the door, wake at the bed, two ponds (only the big south one holds fish), exits north Forest, east Hearthwell, south River delta, no hidden fourth exit, farm cave a small interior map","ref":"55_farm_layout.md#Where each thing goes (draft)"},{"s":"open","t":"Farm layout: exact tillable count, field shape, starting clutter counts; note 19 still says one pond; the 80 by 65 size is an unchecked Stardew claim (SC-25); fixed building positions (SC-24) and clutter regrowth by season (SC-29) are answered, the regrowth amounts are open","ref":"55_farm_layout.md#Open"},{"s":"decided","t":"Valley map asset (docs/valley-map.html, built from docs/valley-map.json by npm run valley-map): two views, the valley and a zoomed Hearthwell, with area names, main buildings and all 30 people as placeholder role labels; design reference only, positions are diagrammatic, and the three non-shop Hearthwell homes are enterable burrows that stand apart; update the JSON when note 19, 20 or 55 changes","ref":"56_valley_map.md#Decisions (owner, 2026-11-06)"},{"s":"decided","t":"The Outpost (draft): two boards (Help Wanted stays at the store, road news at the Outpost from day 1, Special Orders appear later as in Stardew, SC-32), one road trader on Wednesday and Saturday with seeded stock at 1.5 times sell value, the farmhouse TV gives the same forecast (SC-33), road news is gossip plus trader notice plus tomorrow's weather, and a channel table that gives each way of talking to the player one job","ref":"57_the_outpost.md#Decisions (owner, 2026-11-06)"},{"s":"decided","t":"Interiors (draft): 23 interior maps in total. Coop and barn are walked into and, like the farmhouse, each is one map that grows with its tier, unbuilt space black void (note 68, SC-36); the greenhouse is walked into; everyone outside Hearthwell with a shop or home gets one map (hermit's tower, farmstead, forge, fisher, Beach elf); the Outpost has two maps; the stonekeeper, trainer and Wanderer have none; the farmstead has visual-only paddocks outside; Stardew footprints coop 6x3, barn 7x4, greenhouse plot 12x10, interior sizes measured from screenshots, coop 11x8, 15x8, 22x8 and barn 17x13, 21x13, 24x13 (SC-38)","ref":"58_interiors.md#Decisions (owner, 2026-11-06)"},{"s":"decided","t":"Growing interiors (draft): farmhouse, coop and barn are each one map holding every tier, the start room never moves, unbuilt space is black void, the camera is clamped to the built rooms, an upgrade lands overnight, the coop door stays bottom left and the barn door moves by tier; storage in Stardew is not checked, so the rules are stated as what the player sees (SC-36)","ref":"68_growing_interiors.md#The player-visible rules (decided)"},{"s":"open","t":"Water room ferry route; confirming the area sizes against the first Tiled drafts","ref":"19_valley_layout.md#Still open"},{"s":"decided","t":"Area sizes (draft): Hearthwell 120 by 110 and Forest 120 by 120 match Stardew's totals (owner), Farm 80 by 65, Mountain 80 by 70, Secret Woods 48 by 40, delta with Beach 100 by 70, Lake cove 50 by 40, Mines floor 60 by 40; the last three are our guesses (SC-40)","ref":"19_valley_layout.md#Area sizes (draft, revised 2026-11-06)"},{"s":"decided","t":"Special Orders (draft): board opens Fall 2 of year one as Stardew, clock starts on acceptance (ours), first completion pays a unique reward and repeats pay gold; farm debris (rocks, twigs) returns in small capped amounts each season except winter (note 65, SC-32, SC-29)","ref":"65_special_orders_and_debris.md"},{"s":"decided","t":"View size: default 30 by 17 tiles (about 510), wider or squarer windows show more, player zoom setting plus pinch with a cap each way (75 to 200 percent, as Stardew), HUD anchors to the edges, maps need border margins (ADR 0009, SC-42). Build plan: no cap on the extra view, menus keep a centred 960 by 540 box, separate UI size setting, 75 to 150 percent, black bars around small maps (note 64, SC-46, SC-63)","ref":"64_window_canvas_and_hud.md"},{"s":"decided","t":"A stable and a horse as in Stardew: one per player, 10,000g plus Hardwood and iron, speed 6.6 against running at 5, outdoors only, no feeding; extras carrot, book, flute, hats. Walk speed stays at 5 tiles a second as an assumption (SC-41)","ref":"59_horse.md#Answers (owner, 2026-11-06)"},{"s":"open","t":"Map areas design pass (draft, 2026-11-08): one note per unbuilt area, Forest 120 by 120, Secret Woods 48 by 40, Mountain 80 by 70, River delta with the Beach 100 by 70, Lake cove 50 by 40 and Hearthwell 120 by 110, each with a tile sketch, exits and entries, resources, forage, fishing, people, contract needs and slices; build order Forest, Secret Woods, delta, Mountain, Quarry, Forest part 2, cove, Hearthwell shell, Hearthwell interiors, Beach elf. The owner answered all eleven questions on 2026-11-08: the maps are in M3b; no Secret Woods creatures yet and no Mahogany; fishable woods pond (47 fish); Beach footbridge broken until 300 wood; nobody keeps the ferry; cove gets a hidden treasure spot (drafter pick, owner may veto); Hearthwell blacksmith does upgrades and geodes, the Mountain dwarf is a Mines-side trader; Hearthwell river in two arms with the layout still to design; festivals use a decorated Hearthwell variant; the horse rides every outdoor valley map; the stonekeeper gets a Quarry","ref":"71_map_areas_overview.md#Build order, with reasons","issue":636},{"s":"open","t":"Ten map contract additions for the areas: water kinds, the massive log, per-map forage tables, tree kind, per-map stump regrow, conditional layers, rideable flag, cart and board service kinds, nightly spawns","ref":"71_map_areas_overview.md#Map contract additions","issue":636},{"s":"open","t":"Secret Woods (draft): six large stumps regrow every morning for 2 Hardwood each, a steel axe clears the massive log once, and the carpenter's temporary Hardwood sale is removed in the same slice","ref":"73_secret_woods.md#Decisions (draft)","issue":639},{"s":"open","t":"Forest (draft): six groves of about 150 choppable oak and maple regrowing at 20 percent a night give the steady wood supply; farmstead north-east, hermit south-west, Wanderer's camp by the farm road","ref":"72_forest.md#Trees and the steady wood supply","issue":637},{"s":"open","t":"Hearthwell (draft): river in two arms with the sawmill on the main one, the hall on the island and the broken bridge on the east arm; trees cosmetic; interiors by template; people with #599","ref":"77_hearthwell.md#Decisions (draft)","issue":645},{"s":"open","t":"Hearthwell river layout: owner chose two arms (a wide east arm with the broken bridge, the hall on the island) on 2026-11-08 and left the detailed layout of arms, banks, bridges and streets to a later design pass","ref":"77_hearthwell.md#Decisions (draft)","issue":645},{"s":"open","t":"Quarry (draft): a 60 by 44 map past a ravine bridge that a bundle room mends, with rocks and ore that regrow every night and the stonekeeper dwarf at the bridge; four owner questions (which room, the dwarf's trade, regrow numbers, trees)","ref":"78_quarry.md#Decisions (draft)","issue":649},{"s":"open","t":"Smith split (owner, 2026-11-08): the Hearthwell blacksmith does tool upgrades, geode cracking and ore and does not buy geodes; the Mountain smith dwarf is a Mines-side trader (lamps, rest-camp supplies, buys ore, no upgrades)","ref":"74_mountain.md#What lives there","issue":643}],"deps":[],"issues":[67,69,636,637,638,639,640,641,642,643,644,645,646,649],"issueNums":[67,69,636,637,638,639,640,641,642,643,644,645,646,649]},{"id":"story","name":"Story, lore and ending","group":"world","pos":[500,60],"built":"none","builtNote":"","summary":"A cozy valley, a missing relative, the Dawn Carriers and a dark lord who is never seen in ring 1.","items":[{"s":"decided","t":"Ring 1 has no whispers of the dark lord","ref":"09_story_and_lore.md#The dark lord"},{"s":"decided","t":"No lose state; tone rules","ref":"09_story_and_lore.md#Tone rules"},{"s":"proposed","t":"The warden head's six-stage reveal; she visits the farm after the bridge","ref":"09_story_and_lore.md#The warden head's reveal","issue":177},{"s":"open","t":"The player's story and ending","issue":16},{"s":"decided","t":"Final game name: Elderglen (ADR 0011, register check open)","issue":138}],"deps":[],"issues":[15,16,17,138],"issueNums":[15,16,17,138,177]},{"id":"rings","name":"Rings, travel, expeditions","group":"world","pos":[500,330],"built":"none","builtNote":"","summary":"Ring 1 is the home valley and Hearthwell. Ring 2 is a haven; ring 3 is late and optional.","items":[{"s":"decided","t":"Ring 2 opens when The Last Seat is finished","ref":"09_story_and_lore.md#When rings 2 and 3 open"},{"s":"decided","t":"Fairy rings carry the player out from the farm; no second farm","ref":"17_call_feedback_2026-10-28.md#Travel and the second farm"},{"s":"open","t":"Home base: come home each night, or outposts","ref":"01_system_map.md#Spatial structure"},{"s":"open","t":"Ring 2 shape and travel","issue":20},{"s":"open","t":"What is community centre 3?","issue":5}],"deps":["hall-bundles","story"],"issues":[5,20],"issueNums":[5,20]},{"id":"cast","name":"Cast and villagers","group":"people","pos":[740,330],"built":"none","builtNote":"No villager data exists yet.","summary":"About 30 named villagers in ring 1. Almost none are named.","items":[{"s":"decided","t":"Ring 1 cast near Stardew's size; every villager has a saved friendship","ref":"09_story_and_lore.md#Emphasis"},{"s":"decided","t":"Hermit is a witch; Old Greencoat is the Wanderer; sea elf sells the pin","ref":"09_story_and_lore.md#Cast balance"},{"s":"decided","t":"Ring 1 cast structure: 30 people, races, genders, households, 14 candidates","ref":"20_ring1_cast.md#Decisions","issue":136},{"s":"open","t":"Names, ages and looks for the ring 1 cast","ref":"20_ring1_cast.md#Still open"},{"s":"open","t":"The hermit witch Rosmarin (named 2026-11-09): fairy rings are gold plus rare items, edged with local material; unlocked by a custom-themed quest, overgrown herb-hung tower; open: the exact request and prices; the tower is in the Forest and her hook is keeping the old customs as a living ledger","issue":178},{"s":"decided","t":"The warden head knew Oriel; stage 1 is a hidden note trail (as Qi's), her ring 2 challenges sit on a board of her own, stage 3 gives a carrier's mark; dusty mended coat that changes over the rings (first small change at stage 3), dry brief voice, alias Lane, real name Aldreth (ADR 0013), an old ruling line that matters to the ending; the trail is four notes, the first in the Secret Woods and written to Oriel, with three drops near the village (fish, jar, crop) paying a dish, a rare seed and a rare ore; her board is a room in her ring 2 haven base, two weekly odd, big orders (Stardew-like) paid in carrier tokens, a shop of rare one-off goods, and three one-off stage 5 errands that retrace Oriel's road, ending with Oriel's own old mark","ref":"09_story_and_lore.md#The warden head, owner answers (2026-11-08)","issue":177},{"s":"open","t":"The warden head: how her old line matters to the ending (parked for ring 3, M6, after ring 2), the trail's exact items and gift values, the shop list and token prices, the board's order list, the stage 5 errands' exact stops and milestones","issue":177},{"s":"decided","t":"The sea elf is Thalwen (renamed from Ondrel, too close to Oriel): she knew Oriel only slightly, cannot say why she has not sailed home across the sea (not the ring 2 haven), wears a travelling coat and keeps a half-packed trunk, lives in a cottage on the Beach dunes; her unfinished business ties to an old friend among the ring 2 haven elves and plays as a keepsake quest like Birdie's, her voice is dreamy and courteous with slipping plans, and the pin comes from her trunk at 3 hearts","ref":"09_story_and_lore.md#The sea elf, owner answers (2026-11-09)","issue":176},{"s":"open","t":"The sea elf: the haven elf's slot, the keepsake and token, whether she leaves or stays; the Homeward pin opens at 3 hearts, exact price still open","issue":176}],"deps":["valley-map","dialogue"],"issues":[135,136,176,177,178],"issueNums":[135,136,176,177,178]},{"id":"dialogue","name":"Dialogue and voice","group":"people","pos":[740,190],"built":"none","builtNote":"","summary":"Authored lines in priority tiers, capped branching talks, and a voice sheet per character.","items":[{"s":"decided","t":"Authored lines only, no runtime generation","ref":"18_dialogue.md"},{"s":"decided","t":"Base pool plus reactive layer, strict priority tiers, capped branching graphs, four release layers","ref":"18_dialogue.md"},{"s":"decided","t":"A voice sheet per character before any variant lines","ref":"18_dialogue.md"},{"s":"open","t":"Condition vocabulary, heart thresholds, global flags, journal design","ref":"18_dialogue.md"}],"deps":[],"issues":[],"issueNums":[]},{"id":"marriage","name":"Friendship and marriage","group":"people","pos":[740,520],"built":"none","builtNote":"","summary":"Friendship rides on the cast; marriage follows Stardew's shape in our own content.","items":[{"s":"decided","t":"Hat standing is a light cosmetic readout of friendship","ref":"09_story_and_lore.md#The valley folk"},{"s":"decided","t":"Ring 1 has 14 candidates, any player can court any, no pairing limits","ref":"12_marriage.md#Decided (2026-10-29)"},{"s":"decided","t":"Flowers to court, a non-worn ring-like token to propose","ref":"12_marriage.md#Decided (2026-10-29)"},{"s":"decided","t":"Small spouse helps, gentle divorce with a fee, children by choice, no roommate","ref":"12_marriage.md#Decided (2026-10-29)"},{"s":"decided","t":"Stardew scale (250 a heart, 10 or 8 hearts), no decay, one gift a day and two a week, five taste tiers, birthdays x8, quality bonus, bad gifts cost points","ref":"61_friendship_and_gifts.md#Decided (2026-11-06)"},{"s":"decided","t":"Heart events are full cut-scenes, start on walking in with a warning, may reward, and can be replayed from the journal","ref":"62_heart_events.md#Decided (2026-11-06)"},{"s":"decided","t":"Six named universal loves, a long universal hate list (four categories plus named items), the first eight people's draft tastes, and the Midwinter pairing (random among people met, letter on Winter 13)","ref":"61_friendship_and_gifts.md#Universal tastes (decided 2026-11-06)"},{"s":"decided","t":"Heart event scene commands and validator rules (draft)","ref":"62_heart_events.md#Scene commands (draft, 2026-11-06)"},{"s":"open","t":"Names for Moonwool, the Blue Ribbon Melon and the Glimmerstone, tastes for the other 22 people, heart event lists","ref":"61_friendship_and_gifts.md#Not decided (open)"},{"s":"open","t":"Item forms, divorce fee, child room upgrade, ring 2 and 3 counts","ref":"12_marriage.md#Open"}],"deps":["cast"],"issues":[137],"issueNums":[137]},{"id":"mines-combat","name":"Mines and gentle combat","group":"systems","pos":[260,520],"built":"none","builtNote":"","summary":"Opens Spring day 5, 120 floors in three bands. Combat is real-time, gentle and optional, and mining works without it.","items":[{"s":"decided","t":"Mines open on Spring day 5; Old Greencoat says the way is clear and gives nothing else","ref":"22_mines.md#Opening the mines"},{"s":"decided","t":"Real-time, forgiving combat; one health bar shown only where health can be lost; Assist toggle and a no-creatures setting","ref":"22_mines.md#Gentle combat"},{"s":"decided","t":"Defeat the Stardew way: carried out, 10 percent money (cap 1000g) and up to 3 bag stacks lost, one posted back by the trainer","ref":"22_mines.md#Defeat (decided with the owner, Stardew's way)"},{"s":"decided","t":"Stardew-sized mine: 120 floors in three bands, a lift stop at every floor reached, a loot chest camp every 10th floor, a dangerous mode switch at the bottom","ref":"22_mines.md#The mine, floor by floor"},{"s":"decided","t":"Three weapon families, Combat as a fifth skill, a training dummy and a trainer; no boss fights","ref":"22_mines.md#Gentle combat"},{"s":"decided","t":"Creatures from cozy to a little edgy: gloop, moths, crabs, beetles, bats, thieves and old miner skeletons","ref":"22_mines.md#Creatures"},{"s":"decided","t":"Any pickaxe digs any ore; the pickaxe and farm rocks from the start","ref":"22_mines.md#Mining"},{"s":"decided","t":"The smith dwarf sells ore and coal, not bars; she gifts the furnace after the first copper ore; the Smith's bundle gives 20 coal","ref":"22_mines.md#Ore, coal and bars"},{"s":"decided","t":"Fifth tool tier metal Hearthsilver, floors 100 to 120, bars only, no gold (answers part of #194)","ref":"22_mines.md#The fifth tool tier (answers part of #194)"},{"s":"proposed","t":"Dry-streak odds for ladders (also on a kill) and rare finds","ref":"22_mines.md#Finding the way down (dry streak)"},{"s":"open","t":"A Skull Cavern style dig, likely in ring 2, and the big furnace as a ring 2 reward","ref":"22_mines.md#Open"},{"s":"decided","t":"Smith ore at about 2.5 times a bar's value; Nabbler steals nothing; the furnace craft makes more furnaces","ref":"22_mines.md#Ore, coal and bars"},{"s":"decided","t":"Dangerous mode lever on floor 120, gated by reaching 120 and an errand from the warden head","ref":"22_mines.md#Dangerous mode","issue":177},{"s":"decided","t":"Geodes (draft): Geode, Frozen, Magma and Omni drop by depth band as Stardew does, each with its own mineral pool, Omni drawing from all; names and prices are placeholders","ref":"69_geodes_and_minerals.md"}],"deps":[],"issues":[194],"issueNums":[177,194]},{"id":"fishing","name":"Fishing and the water","group":"systems","pos":[20,580],"built":"none","builtNote":"","summary":"Six Water room bundles and one Last Seat bundle depend on it.","items":[{"s":"decided","t":"Ring 1 has a coast; the ferry opens a lake cove; three open lakes, no cove fish in bundles","ref":"16_bundles.md#Rooms and bundles"},{"s":"decided","t":"A softened bar with an assist toggle; a third skill; rod, bait and lure","ref":"21_fishing.md#Decided"},{"s":"decided","t":"Own rod line, two assist levels, the Hearthwell Carp legend at dusk in rain, a fifth tool tier from a deep mine metal","ref":"21_fishing.md#Decided"},{"s":"decided","t":"46 fish, shellfish-only traps, five legends (the Hearthwell Carp first) and the Pearl Lobster","ref":"21_fishing.md#Decided","issue":181},{"s":"decided","t":"A game-wide completion tracker (Perfection-style) is wanted; every fish and legend counts toward it (designed in 39)","ref":"21_fishing.md#Decided","issue":196},{"s":"decided","t":"Achievements follow Stardew's whole list under our own names, each with a unique hat sold at the hatter and a few mail gifts; all greyed in a collections page with a few secret; the completion total waits for the Perfection page","ref":"38_achievements.md#Decisions","issue":196},{"s":"decided","t":"Request board: one request a day with 2 days to finish and no penalty; delivery and gathering first; delivery pays 3x sell price (Stardew); gathering counts from acceptance; no cap, cancel in the journal; no prize tickets yet; one quest record for board, letter and hall sources","ref":"50_request_board_and_quests.md#Decisions"},{"s":"decided","t":"Mail: a farm mailbox with a flag (Stardew); a trigger on day N delivers on the morning of day N+1 (Stardew); opening a letter gives its attachment at once, kept if the pack is full; read letters stay in a journal Mail section (ours); each letter is sent once","ref":"51_mail_and_letters.md#Decisions"},{"s":"decided","t":"Save and exit: two records, a night record written on sleep and a resume record written quietly during play and on page hide; Continue resumes the day, Restart this day loads the night record; Exit saves; daily rolls are stored so reload never rerolls (reload as undo accepted); export and import in Options; one slot","ref":"52_save_and_exit.md#Decisions"},{"s":"decided","t":"Multiplayer is milestone M4, between the vertical slice and ring 2 (old M4 and M5 become M5 and M6); a design note settles its form before any code (ADR 0007)","ref":"../decisions/0007-multiplayer-milestone.md"},{"s":"decided","t":"Multiplayer (M4): same network only, up to 8 players; the host runs the world and guests send intents; any player can host (desktop or tablet), browsers join only; host-save characters, with travelling characters a recorded later option; free cabins when started as multiplayer, bought otherwise; host picks shared or separate money; day ends when all are in bed with a timer fallback; list games on the network or type an address; the final form is a standalone desktop game","ref":"53_multiplayer.md#Decisions"},{"s":"open","t":"Multiplayer: can a tablet host carry 8 players (the wrapper is settled, ADR 0008)","ref":"53_multiplayer.md#Open"},{"s":"decided","t":"Achievements: a library gallery for finds, a daily request board at the general store, no rival route, a hat for every achievement, and Stardew's money thresholds re-checked at tuning","ref":"38_achievements.md#Settled open items","issue":196},{"s":"decided","t":"Completion total: Stardew's categories minus obelisks and the gold clock, with hall bundles and gallery donations added, each ring with its own total and reward (ring 2 is the Ginger Island counterpart) plus a valley total; always visible on the collections page; 100 percent gives a final hat, a hall scene and a keepsake","ref":"39_completion_total.md#Decisions","issue":196},{"s":"decided","t":"Seven elderfruit (+34 max energy each) from seven ring 1 sources: the Harvest Showing counter, the floor 120 chest, a spouse at 12.5 hearts, the hermit's high-price sale, a Secret Woods spirit for the fruit of the hermit's rare seed, the fish mail, and the full gallery set","ref":"39_completion_total.md#Settled with the owner (2026-10-31)","issue":196},{"s":"decided","t":"Completion tracker details: partial progress counts, the valley total is the mean of the rings that exist, the gallery takes minerals, artifacts and found things; the rare seed is the emberseed, given by the hermit at 4 hearts, growing spring to fall","ref":"39_completion_total.md#Settled with the owner (2026-11-08)","issue":196},{"s":"decided","t":"Twelve slayer goals, one per creature kind, each giving a ring or a worn hat, rebuyable from the warden head; Stardew's counts by matching role (numbers are placeholders)","ref":"22_mines.md#The slayer list","issue":196},{"s":"decided","t":"Ring 2's own total: a 130-item collectible at weight 25 (100 open a room) plus eight more categories; reward is a haven hat, scene and keepsake","ref":"39_completion_total.md#Ring 2's total (settled with the owner, 2026-10-31)","issue":196},{"s":"decided","t":"Ring 1's finish: a short hall scene with the steward, Old Greencoat and one line per household head, villagers in the hats the player gave them; keepsake is a lamp that never gutters","ref":"39_completion_total.md#Ring 1's finish (settled with the owner, 2026-10-31)","issue":196},{"s":"decided","t":"Four rods (only the starter limits fish; rare fish need fishing level 5), three baits, six lures with a Magpie Hook treasure table and no double catch, all sold by the delta fisher (numbers are placeholders)","ref":"21_fishing.md#Rods, bait and lures"},{"s":"decided","t":"Legend seasons spread across the year; eight shellfish pot catches, four per water; bundle 17 rare picks confirmed","ref":"21_fishing.md#Shellfish pots"},{"s":"decided","t":"Stardew's five bar behaviours, a first catch that cannot fail, lengths and records, water plants, trash with a recycler, hidden fish, Stardew's fishing professions; fish ponds later","ref":"21_fishing.md#Catch details and Stardew differences (decided 2026-10-31)"},{"s":"decided","t":"Pots work as in Stardew: one bait a day and 38 percent junk, so the Trapper professions apply as written","ref":"21_fishing.md#Shellfish pots (decided 2026-10-29, numbers placeholders)"},{"s":"open","t":"Legend times, weather and prices, and the tracker design (what counts, weights, reward)","ref":"21_fishing.md#Open"}],"deps":[],"issues":[],"issueNums":[181,196]},{"id":"processing-animals","name":"Processing and animals","group":"systems","pos":[500,520],"built":"partial","builtNote":"Built 2026-11-08: coop and barn with tiers, chickens, ducks, rabbits, cow, goat, sheep, pig, incubator, hay silo, animal-goods machines and a first cooking pass (stove, eight placeholder dishes). Not built: heater, animal professions, keeper, animal art, most recipes.","summary":"Machines, cooking, coops and bees. Needed by many bundles. Animals are designed in 23_animals.md; processing and cooking are not.","items":[{"s":"open","t":"Processing machines and cooking design"},{"s":"decided","t":"Seven animals in a coop and a barn on the farm, three tiers each, built by the Hearthwell carpenter","ref":"23_animals.md#Animals","issue":135},{"s":"decided","t":"Feed, pet, let out; products on a timer per species; sleeping outside costs mood and one day's product only","ref":"23_animals.md#Care loop"},{"s":"decided","t":"Hay from grass and a silo, no treats; coop heater keeps winter mood up; young animals bought, incubator hatches eggs","ref":"23_animals.md#Feed and the silo"},{"s":"decided","t":"Stardew's profession tree: Rancher or Tiller at 5, Coopmaster or Shepherd and Artisan or Agriculturist at 10","ref":"23_animals.md#Professions"},{"s":"open","t":"Animal prices, tier costs and grow-up days are placeholders; a valley animal of our own waits for the art pass","ref":"23_animals.md#Open","issue":58},{"s":"decided","t":"Eleven machines, bundle gives the first then craftable; kitchen with the 10,000g house upgrade; 81 recipes across the three rings; cask later","ref":"24_processing_and_cooking.md#Decided with the owner (2026-10-31)"},{"s":"open","t":"Bundle 27 gives a crystalarium; craft ingredient stand-ins and seed maker and smoker sources to check","ref":"24_processing_and_cooking.md#Open"}],"deps":[],"issues":[],"issueNums":[58,135]},{"id":"puzzles","name":"Puzzles","group":"systems","pos":[740,680],"built":"none","builtNote":"","summary":"Optional logic puzzles, never gating and never punishing.","items":[{"s":"decided","t":"Optional only, bonus rewards","ref":"17_call_feedback_2026-10-28.md#Puzzles"},{"s":"open","t":"Puzzle design note: where they live and what kinds"}],"deps":[],"issues":[],"issueNums":[]},{"id":"customisation","name":"Customisation and hats","group":"systems","pos":[20,440],"built":"none","builtNote":"","summary":"Furniture, clothing, dyes and hats.","items":[{"s":"decided","t":"M3 shows hats in a portrait only (replaced 2026-10-31: world sprite)","ref":"13_m3_scope.md#Decisions (2026-10-27)"},{"s":"decided","t":"Furniture: random daily stock at the carpenter plus a catalogue after the first house upgrade, as Stardew; one catalogue per people later","ref":"10_customisation.md#Decisions (2026-10-31)"},{"s":"decided","t":"The achievement list and each one's hat are in the achievements note","ref":"38_achievements.md#Decisions"},{"s":"decided","t":"Hats unlock by achievement as Stardew, are sold at a hatter's shop in Hearthwell run by the Hat-maker household, show in the world sprite, and read as a standing cue with no bonus","ref":"10_customisation.md#Decisions (2026-10-31)"},{"s":"open","t":"Hat names for the achievements that need new systems, furniture pool and prices, sewing machine cost, the per-people catalogues","ref":"10_customisation.md#Open","issue":133},{"s":"decided","t":"Three paid house tiers add rooms, and a building's footprint never changes on upgrade, for every building","ref":"41_house.md#Decisions (2026-10-31)"},{"s":"decided","t":"Every Brimmer home is a burrow, including the player's; the burrow ban in the lore note is lifted","ref":"41_house.md#Decisions (2026-10-31)"},{"s":"decided","t":"Tier 1 of the house is in the first playable; tiers 2 and 3 and the cellar are M3 (spouse room from tier 2, cellar on a separate level; spouse room, nursery and casks stay sealed or empty until those systems exist)","ref":"41_house.md#Decisions (2026-10-31)"},{"s":"decided","t":"House interior is one map per tier (start, tier 1, tier 2, no sealed earth) plus a cellar map; Stardew prices kept for the first playable; catalogue after tier 1 as Stardew; sealed rooms read as waiting","ref":"41_house.md#Settled 2026-10-31 (open items)"},{"s":"open","t":"House room sizes and floor plans; built with placeholders: catalogue at 200,000g and flooring and wallpaper at 200g at the carpenter (where they are sold is still open)","ref":"41_house.md#Open"}],"deps":[],"issues":[133],"issueNums":[133]},{"id":"festivals","name":"Festivals and minigames","group":"systems","pos":[500,680],"built":"partial","builtNote":"All eight festivals are built as screens (2026-11-07): Harvest Showing table and token counter, Hollow Eve maze, Frostday sights, counters. Maps built 2026-11-08 for the Harvest Showing (village green) and Hollow Eve (hedge map, odd-year maze); other festival maps, the even-year maze and villager spots wait for the village map. The farm cave is built too (note 66).","summary":"Two festivals a season; the Hat Parade comes first.","items":[{"s":"decided","t":"One festival in M3, the hat parade; the minigame is a stretch goal","ref":"13_m3_scope.md#Decisions (2026-10-27)"},{"s":"decided","t":"Eight festivals, two a season, with final names and dates (Hat Parade, Seedswap Fair, Cake Day, Lamplight Evening, Harvest Showing, Hollow Eve, Frostday, Midwinter Feast)","ref":"14_festival_calendar.md#The calendar"},{"s":"decided","t":"Fall and winter festivals and the farm cave (draft): Harvest Showing is a 9 good display scored for points, Hollow Eve a lantern maze with a prize chest, Frostday an ice sculpture day until fishing, the mushroom cave comes with a free dehydrator (a new machine)","ref":"66_fall_winter_festivals_and_farm_cave.md"},{"s":"decided","t":"Festival maps: the Harvest Showing uses the village green with shops locked; Hollow Eve has its own hedge map with two mazes by year, a hidden gap and a shortcut back, and villagers inside (all Stardew)","ref":"66_fall_winter_festivals_and_farm_cave.md#Layout addendum: festival maps (2026-11-08)"},{"s":"decided","t":"The shop stays open until a festival opens at noon, then closes for the afternoon","ref":"14_festival_calendar.md#Shop hours (decided 2026-10-31)"},{"s":"open","t":"Prize counter, scores, touch controls","ref":"11_minigames.md#Open"},{"s":"proposed","t":"Random seasonal events with positive or neutral results","ref":"17_call_feedback_2026-10-28.md#Late-game surprises"}],"deps":["cast"],"issues":[131,132,134,155],"issueNums":[131,132,134,155]},{"id":"art-audio","name":"Art and sound","group":"craft","pos":[740,60],"built":"partial","builtNote":"Placeholder art. A portrait and shared sprite body is designed (#58).","summary":"Portraits over a shared sprite body; sound has no plan yet.","items":[{"s":"decided","t":"Portraits plus a shared sprite body","ref":"15_character_art.md#Decisions"},{"s":"open","t":"Who draws the final body; frame size","ref":"15_character_art.md#Open"},{"s":"open","t":"Sound: sourcing and describing the feel"},{"s":"open","t":"Art pass may be redone once bundles and cast settle","issue":58}],"deps":[],"issues":[58],"issueNums":[58]},{"id":"platform","name":"Platform and release","group":"craft","pos":[20,740],"built":"partial","builtNote":"Runs in the browser. The real-tablet check is not done.","summary":"Browser and tablet; installed wrapper later.","items":[{"s":"decided","t":"TypeScript, Phaser, Vite, Tiled (ADR 0004)","ref":"../decisions/0004-engine-and-language.md"},{"s":"decided","t":"Installed apps: Electron on desktop (bundled Chromium, Node host shared with the test host), Capacitor with a native host plugin on tablets, browser is guest only (ADR 0008)","ref":"../decisions/0008-installed-app-wrapper.md","issue":62},{"s":"decided","t":"Project licence: PolyForm Noncommercial for code, CC BY-NC 4.0 for content and art","ref":"../decisions/0006-project-licence.md"},{"s":"decided","t":"One tabbed in-game menu on Esc or E (Stardew), tabs in Stardew order with no Wear tab (equipment sits on the Pack tab); a separate journal on J with a quest log and a hall project log; both pause the clock; Eat stays on F; Social and Map tabs are placeholders; Exit saves the day in progress and goes to the title (ours); K is dropped; the wheel scrolls open lists; Pack gets a trash can, Auto-Sort and a bundle shortcut; Page Up and Page Down switch tabs","ref":"49_menu_and_journal.md#Decisions"},{"s":"decided","t":"Desktop (keyboard and mouse) and touch are separate control profiles, never mixed; every desktop key is rebindable (Stardew); an options screen on the title and in-game menu holds controls only","ref":"45_controls_profiles.md#Decisions"},{"s":"open","t":"Desktop defaults are Stardew's keys plus click to use and act; menu keys fixed; no run key. Eat stays on F, journal on J. Open: layout labels; gamepad parked","ref":"45_controls_profiles.md#Open"},{"s":"decided","t":"Desktop mouse: left-click uses the tile under the cursor within 2 tiles, else turns toward it; turn on click only; red highlight for an impossible tile; wheel down is next slot","ref":"46_desktop_mouse.md#Decisions"},{"s":"decided","t":"Action intent (X, right-click) opens services and picks, shakes, harvests and eats; Use swings tools and plants (Stardew); the hand tool keeps its Use pick-up","ref":"47_action_intent.md#Decisions"},{"s":"decided","t":"Tap-to-move: a bare-ground tap only walks, farming is on the stick scheme; an auto-picked tool stays selected (Stardew) and pulses its slot; hold follows the finger in a straight line (Stardew); seedlings pick the axe; no hint on a plot; four-way A* in core","ref":"48_tap_to_move.md#Decisions"},{"s":"open","t":"Mouse reach (2 tiles), tap and hold numbers, order of Action on one tile","ref":"48_tap_to_move.md#Open"},{"s":"decided","t":"Headless playtest: a bot on src/core/ with a seeded random and a time model, personas from note 08, bundle-chain pace reported first; browser scripts stay for input, scenes and touch","ref":"46_headless_playtest.md#Decisions","issue":319},{"s":"open","t":"Real-tablet check","ref":"08_playtest_personas.md#Touch persona"}],"deps":[],"issues":[19,38,59,62,63],"issueNums":[19,38,59,62,63,319]}],"fetched":"2026-11-08","issueInfo":{"5":{"t":"Design: what is the third community project?","state":"open","labels":["design-question"]},"12":{"t":"Design: define the first playable scope","state":"closed","labels":["enhancement"]},"13":{"t":"Design: audience and size","state":"closed","labels":["design-question","next-payoff"]},"14":{"t":"Design: the core loop of one day","state":"closed","labels":["design-question","next-payoff"]},"15":{"t":"Design: identity, what makes this game its own?","state":"closed","labels":["design-question"]},"16":{"t":"Design: the player's story and ending","state":"closed","labels":["design-question"]},"17":{"t":"Design: emphasis between farming, relationships and expeditions","state":"closed","labels":["design-question"]},"18":{"t":"Design: single player or multiplayer","state":"closed","labels":["design-question"]},"19":{"t":"Decision: choose engine and language (ADR)","state":"closed","labels":["enhancement","next-payoff"]},"20":{"t":"Design: ring 2 shape and travel between rings","state":"open","labe "]},"531":{"t":"WP: Coop and barn growing interiors","state":"closed","labels":["work-package"]},"542":{"t":"Menu rows under the 40 px touch floor in shop, hall and bin","state":"closed","labels":[]},"543":{"t":"Window canvas leftovers: in-game zoom control, device pixel ratio, Borderless Windowed","state":"closed","labels":[]},"550":{"t":"feat: tier 2 widens the kitchen and bedroom (note 68)","state":"closed","labels":["next-payoff"]},"595":{"t":"WP: Fishing slices 1 and 2, the bar, one water and the roster","state":"closed","labels":["work-package"]},"596":{"t":"WP: Fishing slices 3 and 4, bait, lures, conditions, pots, the cove and the legend","state":"open","labels":["work-package"]},"597":{"t":"WP: Mines proper part 1, health, weapons, trainer and first creatures","state":"open","labels":["work-package"]},"598":{"t":"WP: Mines proper part 2, deeper bands, creatures, combat skill, rest camps, lightning rod","state":"open","labels":["work-package"]},"599":{"t":"WP: Villagers, schedules and friendship with gifts","state":"open","labels":["work-package"]},"600":{"t":"WP: Heart events and recipe mail","state":"open","labels":["work-package"]},"601":{"t":"WP: Horse","state":"closed","labels":["work-package"]},"602":{"t":"WP: Cask, cellar, dye vat and greenhouse","state":"closed","labels":["work-package"]},"603":{"t":"WP: The Last Seat, bundles 27 to 30, the bridge and the letter","state":"open","labels":["work-package"]},"604":{"t":"WP: Year two rules and the ring 1 ending","state":"open","labels":["work-package"]},"611":{"t":"WP: Building placement (carpenter placement screen, move and remove)","state":"closed","labels":["work-package"]},"618":{"t":"Coop and barn leftovers (door tiles, art, heater, professions, incubator tile)","state":"open","labels":["enhancement"]},"634":{"t":"Greenhouse follow-up: per-map store, sprinklers, fruit trees indoors, move at carpenter","state":"closed","labels":["enhancement"]},"636":{"t":"WP: Map contract additions for the valley areas","state":"open","labels":["work-package"]},"637":{"t":"WP: Forest map part 1, shell, lake, trees and forage","state":"open","labels":["work-package"]},"638":{"t":"WP: Forest part 2, farmstead, hermit's tower and the Wanderer's camp","state":"open","labels":["work-package"]},"639":{"t":"WP: Secret Woods map, daily hardwood stumps and the massive log","state":"open","labels":["work-package"]},"640":{"t":"WP: River delta and Beach map, waters and the fisher's hut","state":"open","labels":["work-package"]},"641":{"t":"WP: Beach elf's house and the Homeward pin stall","state":"open","labels":["work-package"]},"642":{"t":"WP: Mountain map and the Mines entrance","state":"open","labels":["work-package"]},"643":{"t":"WP: Mountain forge and the stonekeeper's yard","state":"open","labels":["work-package"]},"644":{"t":"WP: Lake cove and the ferry","state":"open","labels":["work-package"]},"645":{"t":"WP: Hearthwell part 1, the shell and moving the farm's doors","state":"open","labels":["work-package"]},"646":{"t":"WP: Hearthwell part 2, the interiors","state":"open","labels":["work-package"]},"649":{"t":"WP: Quarry map, mended bridge, regrowing stone and ore, the stonekeeper","state":"open","labels":["work-package"]}}};
      const REPO = "https://github.com/ricschuster/elderglen";
      const W = 200;
      const H = 62;
      const NS = "http://www.w3.org/2000/svg";
      const byId = Object.fromEntries(DATA.areas.map((a) => [a.id, a]));
      const count = (a, s) => a.items.filter((i) => i.s === s).length;
      const issueOf = (n) => DATA.issueInfo[n];
const openIssues = (a) => a.issueNums.filter((n) => issueOf(n).state === "open");
const isPayoff = (a) => openIssues(a).some((n) => issueOf(n).labels.includes("next-payoff"));
const needed = {};
      DATA.areas.forEach((a) => a.deps.forEach((d) => (needed[d] = (needed[d] || 0) + 1)));
      let filter = "all";
      let selected = null;

      const el = (tag, attrs = {}, parent) => {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        if (parent) parent.appendChild(e);
        return e;
      };
      const h = (tag, props = {}, kids = []) => {
        const e = document.createElement(tag);
        Object.assign(e, props);
        kids.forEach((k) => e.append(k));
        return e;
      };

      const filters = {
        all: ["All", () => true],
        open: ["Has open questions", (a) => count(a, "open") > 0],
        unbuilt: ["Not built", (a) => a.built !== "done"],
        blockers: ["Blocks other areas", (a) => (needed[a.id] || 0) > 0],
        payoff: ["Next payoff", isPayoff],
      };

      function drawBar() {
        const bar = document.getElementById("bar");
        bar.replaceChildren();
        for (const k in filters) {
          const b = h("button", { textContent: filters[k][0] });
          b.setAttribute("aria-pressed", String(filter === k));
          b.onclick = () => {
            filter = k;
            draw();
          };
          bar.append(b);
        }
      }

      function drawMap() {
        const edges = document.getElementById("edges");
        const nodes = document.getElementById("nodes");
        edges.replaceChildren();
        nodes.replaceChildren();
        const keep = filters[filter][1];
        const rel = new Set();
        if (selected) {
          rel.add(selected);
          byId[selected].deps.forEach((d) => rel.add(d));
          DATA.areas.forEach((a) => a.deps.includes(selected) && rel.add(a.id));
        }
        for (const a of DATA.areas) {
          for (const d of a.deps) {
            const from = byId[d];
            const to = a;
            const x1 = from.pos[0] + W / 2;
            const y1 = from.pos[1] + H / 2;
            const x2 = to.pos[0] + W / 2;
            const y2 = to.pos[1] + H / 2;
            const dx = x2 - x1;
            const dy = y2 - y1;
            const t = Math.min(
              dx ? (W / 2 + 6) / Math.abs(dx) : Infinity,
              dy ? (H / 2 + 6) / Math.abs(dy) : Infinity,
            );
            const hot = selected && (a.id === selected || d === selected);
            const dim = (selected && !hot) || !(keep(a) && keep(from));
            el(
              "line",
              {
                class: "edge" + (hot ? " hot" : "") + (dim ? " dim" : ""),
                x1: x1 + dx * t,
                y1: y1 + dy * t,
                x2: x2 - dx * t,
                y2: y2 - dy * t,
              },
              edges,
            );
          }
        }
        for (const a of DATA.areas) {
          const dim = (selected && !rel.has(a.id)) || !keep(a);
          const g = el(
            "g",
            {
              class: "node" + (selected === a.id ? " sel" : "") + (dim ? " dim" : ""),
              transform: `translate(${a.pos[0]} ${a.pos[1]})`,
              tabindex: 0,
              role: "button",
              "aria-label": a.name,
            },
            nodes,
          );
          el("rect", { class: "box", width: W, height: H, rx: 8 }, g);
          el("text", { x: 10, y: 22 }, g).textContent = a.name.length > 28 ? a.name.slice(0, 27) + "…" : a.name;
          const total = a.items.length || 1;
          let x = 10;
          for (const s of ["decided", "proposed", "open"]) {
            const w = ((W - 20) * count(a, s)) / total;
            if (w) el("rect", { x, y: 32, width: w, height: 8, fill: `var(--${s})` }, g);
            x += w;
          }
          el("text", { class: "sm", x: 10, y: 55 }, g).textContent =
            `${count(a, "decided")} / ${count(a, "proposed")} / ${count(a, "open")}`;
          const oi = openIssues(a).length;
          const tot = a.issueNums.length;
          if (tot) {
            el("text", { class: "sm", x: W - 10, y: 55, "text-anchor": "end" }, g).textContent =
              `${oi} open / ${tot} issues`;
          }
          if (isPayoff(a)) {
            el("text", { x: W - 14, y: 22, "text-anchor": "end", fill: "#d9a441" }, g).textContent = "★";
          }
          const bw = { none: 0, partial: 0.5, done: 1 }[a.built] * W;
          el("rect", { x: 0, y: H - 4, width: W, height: 4, fill: "#e6e0cf" }, g);
          if (bw) el("rect", { x: 0, y: H - 4, width: bw, height: 4, fill: "#2a5d9f" }, g);
          const pick = () => {
            selected = selected === a.id ? null : a.id;
            draw();
          };
          g.onclick = pick;
          g.onkeydown = (e) => (e.key === "Enter" || e.key === " ") && (e.preventDefault(), pick());
        }
      }

      function drawPanel() {
        const p = document.getElementById("panel");
        p.replaceChildren();
        if (!selected) {
          p.append(
            h("h2", { textContent: "Overview" }),
            h("p", {
              textContent:
                "Click an area to see what is decided, proposed and open, with links to the notes and issues. Boxes show decided / proposed / open counts.",
            }),
          );
          const open = DATA.areas
            .flatMap((a) => a.items.filter((i) => i.s === "open").map((i) => ({ a, i })))
            .length;
          p.append(h("p", { textContent: `${open} open questions across ${DATA.areas.length} areas.` }));
          const rank = [...DATA.areas].sort((x, y) => (needed[y.id] || 0) - (needed[x.id] || 0)).slice(0, 5);
          p.append(h("h3", { textContent: "Most depended on" }));
          const ul = h("ul");
          rank.forEach((a) => {
            const b = h("a", { href: "#", textContent: a.name });
            b.onclick = (e) => {
              e.preventDefault();
              selected = a.id;
              draw();
            };
            ul.append(h("li", { className: "decided" }, [b, ` (${needed[a.id] || 0})`]));
          });
          p.append(ul);
          return;
        }
        const a = byId[selected];
        p.append(h("h2", { textContent: a.name }), h("p", { textContent: a.summary }));
        p.append(
          h("span", { className: "tag", textContent: "Built: " + a.built }),
          h("span", { className: "tag", textContent: DATA.groups[a.group] }),
        );
        if (a.builtNote) p.append(h("p", { className: "ref", textContent: a.builtNote }));
        if (a.issueNums.length) {
          const wp = a.issueNums.filter((n) => issueOf(n).labels.includes("work-package"));
          const done = wp.filter((n) => issueOf(n).state === "closed").length;
          if (wp.length) {
            p.append(h("p", { className: "ref", textContent: `Work packages: ${done} of ${wp.length} closed.` }));
          }
        }
        const link = (id) => {
          const b = h("a", { href: "#", textContent: byId[id].name });
          b.onclick = (e) => {
            e.preventDefault();
            selected = id;
            draw();
          };
          return b;
        };
        const needs = a.deps;
        const usedBy = DATA.areas.filter((x) => x.deps.includes(a.id)).map((x) => x.id);
        for (const [label, list] of [["Needs", needs], ["Needed by", usedBy]]) {
          if (!list.length) continue;
          p.append(h("h3", { textContent: label }));
          const ul = h("ul");
          list.forEach((id) => ul.append(h("li", { className: "decided" }, [link(id)])));
          p.append(ul);
        }
        if (a.issueNums.length) {
          p.append(h("h3", { textContent: `GitHub issues (${openIssues(a).length} open)` }));
          const ul = h("ul");
          const sorted = [...a.issueNums].sort(
            (x, y) => (issueOf(x).state === "open" ? 0 : 1) - (issueOf(y).state === "open" ? 0 : 1),
          );
          for (const n of sorted) {
            const info = issueOf(n);
            const kids = [
              h("a", { href: `${REPO}/issues/${n}`, textContent: `#${n}` }),
              " " + info.t,
            ];
            info.labels.forEach((l) => kids.push(h("span", { className: "tag", textContent: l })));
            const li = h("li", { className: info.state === "open" ? "open" : "decided" }, kids);
            if (info.state !== "open") li.style.opacity = "0.6";
            ul.append(li);
          }
          p.append(ul);
        }
        for (const s of ["open", "proposed", "decided"]) {
          const items = a.items.filter((i) => i.s === s);
          if (!items.length) continue;
          p.append(h("h3", { textContent: `${s} (${items.length})` }));
          const ul = h("ul");
          for (const i of items) {
            const li = h("li", { className: s }, [i.t]);
            if (i.ref) {
              const [file, heading] = i.ref.split("#");
              const src = h("span", { className: "ref" }, [
                h("a", { href: "design/" + file, textContent: file }),
                heading ? " > " + heading : "",
              ]);
              li.append(src);
            }
            if (i.issue) {
              li.append(
                h("span", { className: "ref" }, [
                  h("a", { href: `${REPO}/issues/${i.issue}`, textContent: "#" + i.issue }),
                ]),
              );
            }
            ul.append(li);
          }
          p.append(ul);
        }
      }

      function draw() {
        drawBar();
        drawMap();
        drawPanel();
      }
      document.getElementById("sub").textContent =
        `Hand-kept in docs/overview.json. Last updated ${DATA.updated}. Issues as of ${DATA.fetched}.`;
      draw();
    </script>
  </body>
