<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Elderglen layout page (dev only)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1b1f1b;
        color: #ddd;
        font: 12px sans-serif;
      }
      #app {
        display: grid;
        grid-template-columns: 220px 1fr 280px;
        grid-template-rows: 1fr 160px;
        height: 100%;
      }
      #maps {
        grid-row: 1 / 3;
        overflow: auto;
        border-right: 1px solid #444;
        padding: 4px;
      }
      #maps div {
        cursor: pointer;
        padding: 1px 3px;
      }
      #maps div.sel {
        background: #355;
      }
      #maps .bad {
        color: #ff8080;
      }
      #canvaswrap {
        overflow: auto;
        position: relative;
      }
      #side {
        overflow: auto;
        border-left: 1px solid #444;
        padding: 6px;
      }
      #problems {
        grid-column: 2 / 4;
        overflow: auto;
        border-top: 1px solid #444;
        padding: 4px;
      }
      #problems div {
        cursor: pointer;
        color: #ff9a9a;
      }
      #problems div:hover {
        background: #333;
      }
      label {
        display: block;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
      }
      button,
      select,
      input {
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="maps"></div>
      <div id="canvaswrap"><canvas id="canvas"></canvas></div>
      <div id="side"></div>
      <div id="problems"></div>
    </div>
    <script type="module" src="/src/layout/main.ts"></script>
  </body>
</html>
